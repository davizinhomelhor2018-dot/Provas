<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--p:#111116;--p2:#18181f;--l:rgba(242,217,78,.15);--a:#f2d94e;--a2:#b8941f;--t:#eeeef2;--m:#8d8d98;--ok:#2ee59d;--bad:#ff4d5e;--warn:#ffb020}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Exo 2',system-ui,sans-serif;background:radial-gradient(900px 400px at 50% -100px,rgba(242,217,78,.12),transparent),linear-gradient(rgba(242,217,78,.025) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(242,217,78,.025) 1px,transparent 1px) 0 0/40px 40px,var(--bg);color:var(--t);min-height:100vh}
h1,h2,h3,.brand,.tm,.btn,.tab{font-family:Rajdhani,'Exo 2',sans-serif}
h2{font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--a)}h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin:22px 0 8px}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(7,7,10,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em}.brand i{font-style:normal;color:#1a1400;background:linear-gradient(135deg,var(--a2),var(--a));width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.brand span{color:var(--a)}
.user{display:flex;align-items:center;gap:10px}.user small{display:block;color:var(--m);font-size:11px;line-height:1.1}.user b{font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:var(--p2);border:1px solid var(--a);color:var(--a);display:grid;place-items:center;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 100px}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 8px 24px #0006}

input,select,textarea{width:100%;padding:11px 12px;margin:4px 0 10px;background:#0b0b0f;color:var(--t);border:1px solid #2a2a33;border-radius:10px;font:inherit;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(242,217,78,.15)}
label.f{display:block;color:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
input[type=radio],input[type=checkbox]{width:auto;margin:0 8px 0 0;accent-color:var(--a)}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;cursor:pointer;color:#1a1400;background:linear-gradient(135deg,var(--a2),var(--a));transition:.15s}
.btn:hover{filter:brightness(1.12);box-shadow:0 0 18px rgba(242,217,78,.3)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--a);border:1px solid var(--l)}.btn.red{background:rgba(255,77,94,.15);color:#ff7d8a;border:1px solid rgba(255,77,94,.4)}.btn.sm{padding:6px 12px;font-size:12px}.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.m{color:var(--m);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.cat{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.chip{display:inline-block;background:#0b0b0f;border:1px solid #2a2a33;border-radius:8px;padding:2px 9px;font-size:12px;color:var(--m);margin:6px 6px 0 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.tab{flex:1;white-space:nowrap;padding:10px 14px;border-radius:10px;border:1px solid var(--l);background:var(--p);color:var(--m);font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer}.tab.on{background:linear-gradient(135deg,var(--a2),var(--a));color:#1a1400;border:0}
.login{max-width:400px;margin:6vh auto;padding:0 14px}.emb{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:40px;color:var(--a);border:2px solid var(--a);background:radial-gradient(circle,rgba(242,217,78,.18),transparent 70%);box-shadow:0 0 40px rgba(242,217,78,.25)}
.login h1{text-align:center;letter-spacing:.24em;font-size:28px}.login p.s{text-align:center;color:var(--m);margin:2px 0 14px}
.note{background:rgba(242,217,78,.08);border:1px solid var(--l);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:var(--a)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}.stat{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px}.stat b{display:block;font:700 30px Rajdhani}.stat span{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.1em}
.scroll{overflow-x:auto;border:1px solid var(--l);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid #22222a;text-align:left;white-space:nowrap}th{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:#0d0d11}tr:last-child td{border:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}.pill:before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(46,229,157,.1)}.pill.bad{color:var(--bad);background:rgba(255,77,94,.12)}.pill.bad:before{animation:pl 1s infinite}.pill.off{color:var(--m);background:#ffffff0d}.pill.fin{color:var(--a);background:rgba(242,217,78,.1)}
@keyframes pl{50%{opacity:.25}}
.tm{font-size:24px;font-weight:700;color:var(--a);background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:0 14px;letter-spacing:.06em}.tm.low{color:var(--bad);border-color:var(--bad);animation:pl 1s infinite}
.prog{height:5px;background:#22222a;border-radius:9px;overflow:hidden;margin:6px 0 12px}.prog div{height:100%;width:0;background:linear-gradient(90deg,var(--a2),var(--a));transition:.3s}
.qn{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.qn a{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid #2a2a33;color:var(--m);font-weight:700;cursor:pointer}.qn a.d{background:var(--a);color:#1a1400;border-color:var(--a)}
.q{scroll-margin-top:80px}.q .n{color:var(--a);font:700 13px Rajdhani;letter-spacing:.14em}.q p{margin:6px 0 12px;font-size:16px}
.opt{display:flex;gap:12px;align-items:center;padding:12px;margin:8px 0;border:1px solid #2a2a33;border-radius:12px;background:#0b0b0f;cursor:pointer;transition:.15s}.opt input{display:none}.opt b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a3a45;color:var(--m);flex:none}.opt.on{border-color:var(--a);background:rgba(242,217,78,.08)}.opt.on b{background:var(--a);color:#1a1400;border-color:var(--a)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(7,7,10,.92);backdrop-filter:blur(14px);border-top:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;gap:12px}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:99;padding:14px;backdrop-filter:blur(4px)}#modal .box{background:var(--p2);border:1px solid var(--a);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:pop .2s}@keyframes pop{from{transform:scale(.94);opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--a);color:#1a1400;font-weight:700;padding:10px 18px;border-radius:999px;z-index:120;animation:pop .2s}
body.exam{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body.exam textarea{-webkit-user-select:text;user-select:text}@media print{body.exam{display:none}}

<script>
const CFG={apiKey:"AIzaSyDVIKbfNVw4_iQGdiLrJhRfcPSVNjeZDLU",authDomain:"comando-geral-98c87.firebaseapp.com",databaseURL:"https://comando-geral-98c87-default-rtdb.firebaseio.com",projectId:"comando-geral-98c87",storageBucket:"comando-geral-98c87.firebasestorage.app",messagingSenderId:"744810462465",appId:"1:744810462465:web:075ce2c6fdad28e6b1ef00"};
let db,R,val;const vals=o=>o?Object.entries(o).map(([id,v])=>({id,...v})):[];
const load=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function boot(){const V='10.12.2';for(const b of['https://www.gstatic.com/firebasejs/'+V+'/','https://cdn.jsdelivr.net/npm/firebase@'+V+'/','https://cdnjs.cloudflare.com/ajax/libs/firebase/'+V+'/']){try{await load(b+'firebase-app-compat.js');await load(b+'firebase-database-compat.js');if(window.firebase)return true}catch(e){}}return false}
function init(){firebase.initializeApp(CFG);db=firebase.database();R=p=>db.ref(p);val=async p=>(await R(p).once('value')).val()}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={Tenente:['★','#5fb3ff'],Capitão:['★★','#7be0a1'],Major:['★★★','#ffb020'],Coronel:['★★★★','#f2d94e']},CL=Object.keys(CATS),L='ABCD',key=l=>l.toLowerCase().replace(/[^a-z0-9_-]/g,'_');
const cat=c=>`<span class="cat" style="--c:${CATS[c][1]}">${CATS[c][0]} ${c}</span>`;
let me=null,unsubs=[],P,SS,SREF,H={},tick,beat,fora=false,ended=false,E,qs,SN=[],GB={},tt,FIRST=false;
const view=h=>{$('#app').innerHTML=h},modal=h=>{$('#modal').innerHTML='<div class="box">'+h+'</div>';$('#modal').style.display='flex'},closeModal=()=>{$('#modal').style.display='none'},err=t=>{const e=$('#er');if(e)e.textContent=t};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
const hdr=()=>`<header class="nav"><div class="brand"><i>★</i><b>PROVAS</b><span>COMANDO</span></div>${me?`<div class="user"><div class="av">${esc((me.nome||'?')[0]).toUpperCase()}</div><div><b>${esc(me.nome)}</b><small>${me.role==='admin'?'ADM':'CANDIDATO'}</small></div><button class="btn ghost sm" onclick="sair()">Sair</button></div>`:''}</header>`;
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("yuba|"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "yuba|"+t)h=((h<<5)+h+c.charCodeAt(0))|0;return"f"+(h>>>0).toString(36)}}

/* ---------- LOGIN (o primeiro login vira ADM) ---------- */
async function loginView(){view(hdr()+`<div class="login"><div class="emb">★</div><h1>PROVAS</h1><p class="s">Comando Militar · Acesso restrito</p><div class="card"><div id="fn"></div><label class="f">Login</label><input id="lg" autocapitalize="none" autocomplete="username"><label class="f">Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div id="c2"></div><button class="btn full" id="bt" onclick="doLogin()">Entrar</button><p id="er" class="err"></p></div></div>`);
 try{FIRST=(await val('provas/admins'))===null}catch(e){}
 if(FIRST){$('#fn').innerHTML='<div class="note">🛡️ <b>Primeiro acesso.</b> O login e a senha que você digitar agora serão o <b>ADM</b>.</div>';$('#c2').innerHTML='<label class="f">Confirmar senha</label><input id="pw2" type="password">';$('#bt').textContent='Criar ADM e entrar'}}
async function doLogin(){const raw=$('#lg').value.trim().toLowerCase(),l=key(raw),p=$('#pw').value;if(!l||!p)return err('Informe login e senha.');err('');$('#bt').disabled=true;
 try{const h=await sha(p);me=null;
  if(FIRST){if(p.length<4||p!==$('#pw2').value)throw'As senhas não conferem ou são curtas (mín. 4).';if(await val('provas/admins'))throw'Já existe um ADM. Recarregue a página.';await R('provas/admins/'+l).set({nome:raw,hash:h});me={role:'admin',login:l,nome:raw};toast('ADM criado. Bem-vindo!');return adminView()}
  const[d,a]=await Promise.all([val('provas/admins/'+l),val('provas/alunos/'+l)]);
  if(d&&d.hash===h)me={role:'admin',login:l,nome:d.nome};else if(a&&a.hash===h)me={role:'aluno',login:l,nome:a.nome};
  else{const x=Object.values((await val('yuba/estado/USERS'))||{}).find(u=>u.login===raw&&u.hash===h&&['SUPER ADMIN','FEDERAL'].includes(u.perfil));if(x)me={role:'admin',login:l,nome:x.nome}}
  if(!me)throw'Login ou senha inválidos.';me.role==='admin'?adminView():aviso()}
 catch(e){$('#bt').disabled=false;err(typeof e==='string'?e:'Erro de conexão com o Firebase.')}}
function sair(){unsubs.forEach(f=>f());unsubs=[];stopExam();closeModal();me=null;loginView()}

/* ---------- CANDIDATO ---------- */
function aviso(){view(hdr());modal(`<div style="font-size:34px">⚠️</div><h2 style="margin:6px 0">Aviso importante</h2><p class="m">Olá, <b style="color:var(--t)">${esc(me.nome)}</b>. Leia antes de continuar:</p><ul style="margin:12px 0 16px 18px;line-height:1.8"><li>É <b>proibido copiar e colar</b> dentro da prova.</li><li>Sair da tela (trocar de aba ou aplicativo) é <b>registrado em tempo real</b> para o aplicador.</li><li>Conforme a prova, sair <b>encerra a avaliação</b> ou conta contra um limite de saídas.</li><li>O tempo continua correndo mesmo que você saia.</li></ul><button class="btn full" onclick="closeModal();listProvas()">Li e confirmo</button><button class="btn ghost full" style="margin-top:8px" onclick="sair()">Cancelar</button>`)}
async function listProvas(){
 const [ps,ss]=await Promise.all([val('provas/provas'),R('provas/sessoes').orderByChild('login').equalTo(me.login).once('value')]);
 const S={};vals(ss.val()).forEach(s=>S[s.provaId]=s);const l0=vals(ps).filter(p=>p.ativa);
 view(hdr()+`<main class="wrap"><div class="card"><h2>Olá, ${esc(me.nome)}</h2><p class="m">Selecione a prova que deseja realizar.</p></div>`+CL.map(c=>{const l=l0.filter(p=>p.categoria===c);return l.length?`<h3>${c}</h3><div class="grid">`+l.map(p=>{const s=S[p.id];return `<div class="card">${cat(p.categoria)}<div style="font:700 19px Rajdhani;margin:10px 0 2px">${esc(p.titulo)}</div><span class="chip">⏱ ${p.minutos} min</span><span class="chip">${(p.questoes||[]).length} questões</span><span class="chip">${p.saidaPermitida?'🚪 pode sair '+p.maxSaidas+'x':'🔒 não pode sair'}</span><div style="margin-top:14px">${s&&s.status==='finalizada'?'<span class="pill fin">Concluída</span>':`<button class="btn full" onclick="confirmStart('${p.id}')">${s?'Continuar prova':'Iniciar prova'}</button>`}</div></div>`}).join('')+'</div>':''}).join('')+(l0.length?'':'<p class="m" style="text-align:center;margin-top:40px">Nenhuma prova disponível no momento.</p>')+'</main>')}
async function confirmStart(id){const p=await val('provas/provas/'+id);
 modal(`${cat(p.categoria)}<h2 style="margin:8px 0">${esc(p.titulo)}</h2><p style="line-height:1.8">⏱ Tempo: <b>${p.minutos} min</b><br>${p.saidaPermitida?`🚪 Saídas permitidas: <b>${p.maxSaidas}</b>. Ao passar disso a prova é encerrada.`:'🔒 <b>Não é permitido sair</b>: se sair, a prova é encerrada na hora.'}</p><button class="btn full" style="margin-top:12px" onclick="startExam('${id}')">Começar agora</button><button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Voltar</button>`)}
async function startExam(id){closeModal();P={id,...(await val('provas/provas/'+id))};P.questoes=P.questoes||[];
 SREF=R('provas/sessoes/'+id+'_'+me.login);const sd=await SREF.once('value');
 if(sd.exists())SS=sd.val();else{SS={login:me.login,nome:me.nome,provaId:id,provaTitulo:P.titulo,status:'em_andamento',saidas:0,fora:false,inicio:Date.now(),ultimo:Date.now()};await SREF.set(SS)}
 SS.respostas=SS.respostas||{};
 if(SS.status==='finalizada')return listProvas();
 renderExam();bindExam()}
function renderExam(){const n=P.questoes.length;
 view(`<header class="nav"><div class="brand"><i>★</i><b style="max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(P.titulo)}</b></div><div class="row"><span class="chip" id="sd" style="margin:0"></span><span id="tm" class="tm">--:--</span></div></header><main class="wrap"><div class="m" id="pc"></div><div class="prog"><div id="pb"></div></div><div class="qn">${P.questoes.map((_,i)=>`<a id="c${i}" onclick="document.getElementById('q${i}').scrollIntoView({behavior:'smooth'})">${i+1}</a>`).join('')}</div>`+
 P.questoes.map((q,i)=>`<div class="card q" id="q${i}"><div class="n">QUESTÃO ${i+1} DE ${n}</div><p>${esc(q.enun)}</p>`+(q.tipo==='multipla'?(q.ops||[]).map((o,j)=>`<label class="opt ${SS.respostas[i]===j?'on':''}"><input type="radio" name="q${i}" ${SS.respostas[i]===j?'checked':''} onchange="ans(${i},${j})"><b>${L[j]}</b><span>${esc(o)}</span></label>`).join(''):`<textarea rows="6" placeholder="Digite sua resposta…" oninput="ansT(${i},this.value)">${esc(SS.respostas[i]||'')}</textarea>`)+'</div>').join('')+
 `</main><div class="foot"><span class="m" id="pc2"></span><button class="btn" onclick="askFinish()">Finalizar prova</button></div>`);upd();prog()}
function prog(){const n=P.questoes.length;let d=0;P.questoes.forEach((_,i)=>{const r=SS.respostas[i],ok=r!==undefined&&r!==null&&r!=='';if(ok)d++;const c=$('#c'+i);if(c)c.classList.toggle('d',ok)});$('#pb').style.width=(n?d/n*100:0)+'%';$('#pc').textContent=$('#pc2').textContent=`${d} de ${n} respondidas`}
function askFinish(){modal(`<h2>Finalizar prova?</h2><p class="m" style="margin:8px 0 14px">Não será possível voltar depois de finalizar.</p><button class="btn full" onclick="finish('Finalizada pelo candidato')">Sim, finalizar</button><button class="btn ghost full" style="margin-top:8px" onclick="closeModal()">Voltar à prova</button>`)}
const ans=(i,j)=>{SS.respostas[i]=j;document.querySelectorAll('[name=q'+i+']').forEach(r=>r.closest('.opt').classList.toggle('on',r.checked));SREF.child('respostas/'+i).set(j);prog()};
const ansT=(i,v)=>{SS.respostas[i]=v;prog();clearTimeout(tt);tt=setTimeout(()=>SREF.child('respostas/'+i).set(v),700)};
function upd(){const s=$('#sd');if(s)s.textContent=P.saidaPermitida?`🚪 ${SS.saidas}/${P.maxSaidas}`:'🔒 sem saída'}
function bindExam(){ended=false;fora=!!SS.fora;document.body.classList.add('exam');const blk=e=>e.preventDefault();
 H={copy:blk,cut:blk,paste:blk,drop:blk,dragstart:blk,contextmenu:blk,
  selectstart:e=>{if(!(e.target.closest&&e.target.closest('textarea')))e.preventDefault()},
  keydown:e=>{const k=e.key.toLowerCase();if(((e.ctrlKey||e.metaKey)&&('cvxapu'.includes(k)||k==='insert'))||(e.shiftKey&&k==='insert'))e.preventDefault()},
  visibilitychange:()=>document.hidden?leave():back(),blur:leave,focus:back};
 for(const k in H)(k==='blur'||k==='focus'?window:document).addEventListener(k,H[k]);
 back();tick=setInterval(()=>{const r=SS.inicio+P.minutos*60000-Date.now();if(r<=0)return finish('Tempo esgotado');const s=Math.ceil(r/1000),t=$('#tm');t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');t.classList.toggle('low',r<300000)},1000);
 beat=setInterval(()=>SREF.update({ultimo:Date.now()}),10000)}
function stopExam(){for(const k in H)(k==='blur'||k==='focus'?window:document).removeEventListener(k,H[k]);H={};clearInterval(tick);clearInterval(beat);document.body.classList.remove('exam')}
async function leave(){if(ended||fora)return;fora=true;SS.saidas++;await SREF.update({fora:true,saidas:SS.saidas,ultimaSaida:Date.now()});
 if(!P.saidaPermitida||SS.saidas>P.maxSaidas)return finish(P.saidaPermitida?'Excedeu o limite de saídas':'Saiu da prova');upd()}
async function back(){if(ended||!fora)return;fora=false;await SREF.update({fora:false});upd()}
async function finish(m){if(ended)return;ended=true;stopExam();closeModal();await SREF.update({status:'finalizada',fim:Date.now(),motivo:m,fora});
 view(hdr()+`<div class="login"><div class="card" style="text-align:center"><div style="font-size:48px">${m.startsWith('Finalizada')?'✅':'⛔'}</div><h2 style="margin:6px 0">Prova encerrada</h2><p class="m" style="margin-bottom:14px">${esc(m)}</p><button class="btn full" onclick="listProvas()">Voltar às provas</button></div></div>`)}

/* ---------- ADM ---------- */
function adminView(tab='provas'){unsubs.forEach(f=>f());unsubs=[];
 view(hdr()+`<main class="wrap"><nav class="tabs">${[['provas','📋 Provas'],['alunos','👥 Candidatos'],['vivo','🔴 Ao vivo']].map(([k,n])=>`<button class="tab ${k===tab?'on':''}" onclick="adminView('${k}')">${n}</button>`).join('')}</nav><div id="ad"></div></main>`);
 ({provas:tabProvas,alunos:tabAlunos,vivo:tabVivo})[tab]()}
async function tabProvas(){const ps=vals(await val('provas/provas'));
 $('#ad').innerHTML=`<div class="row"><h2 class="sp">Provas · ${ps.length}</h2><button class="btn" onclick="editProva()">+ Nova prova</button></div>`+CL.map(c=>{const l=ps.filter(p=>p.categoria===c);return l.length?`<h3>${c}</h3><div class="grid">`+l.map(p=>`<div class="card">${cat(c)} ${p.ativa?'':'<span class="pill off">inativa</span>'}<div style="font:700 19px Rajdhani;margin:10px 0 2px">${esc(p.titulo)}</div><span class="chip">${(p.questoes||[]).length} questões</span><span class="chip">⏱ ${p.minutos} min</span><span class="chip">${p.saidaPermitida?'🚪 sai até '+p.maxSaidas+'x':'🔒 não pode sair'}</span><div class="row" style="margin-top:12px"><button class="btn sm" onclick="editProva('${p.id}')">Editar</button><button class="btn sm red" onclick="delProva('${p.id}')">Excluir</button></div></div>`).join('')+'</div>':''}).join('')+(ps.length?'':'<p class="m" style="text-align:center;margin-top:40px">Nenhuma prova criada ainda.</p>')}
async function delProva(id){if(!confirm('Excluir esta prova?'))return;await R('provas/provas/'+id).remove();await R('provas/gabaritos/'+id).remove();adminView()}
function addQ(){qs.push({tipo:'multipla',enun:'',ops:['','','',''],ok:0})}
async function editProva(id){E={id,titulo:'',categoria:'Tenente',minutos:60,saidaPermitida:false,maxSaidas:0,ativa:true};qs=[];
 if(id){const [p,g0]=await Promise.all([val('provas/provas/'+id),val('provas/gabaritos/'+id)]);E={id,...p};const g=(g0&&g0.gab)||[];
  qs=(p.questoes||[]).map((q,i)=>({tipo:q.tipo,enun:q.enun,ops:[...(q.ops||[]),'','','',''].slice(0,4),ok:g[i]>=0?g[i]:0}))}else addQ();
 formProva()}
function readTop(){if(!$('#ti'))return;E.titulo=$('#ti').value;E.categoria=$('#ca').value;E.minutos=$('#mi').value;E.saidaPermitida=$('#sp').checked;E.maxSaidas=$('#ms').value;E.ativa=$('#at').checked}
const rf=()=>{readTop();formProva()};
function formProva(){$('#ad').innerHTML=`<h2>${E.id?'Editar prova':'Nova prova'}</h2><div class="card"><label class="f">Título</label><input id="ti" value="${esc(E.titulo)}"><label class="f">Categoria</label><select id="ca">${CL.map(c=>`<option ${c===E.categoria?'selected':''}>${c}</option>`).join('')}</select><label class="f">Tempo (minutos)</label><input id="mi" type="number" min="1" value="${E.minutos}"><label class="row" style="margin:6px 0"><input id="sp" type="checkbox" ${E.saidaPermitida?'checked':''}> Permitir sair da tela</label><label class="f">Quantas vezes pode sair (0 = nenhuma)</label><input id="ms" type="number" min="0" value="${E.maxSaidas}"><label class="row"><input id="at" type="checkbox" ${E.ativa?'checked':''}> Prova ativa (visível aos candidatos)</label></div>`+
 qs.map((q,i)=>`<div class="card"><div class="row"><b style="color:var(--a)">Questão ${i+1}</b><select style="width:auto;margin:0" class="sp" onchange="qs[${i}].tipo=this.value;rf()"><option value="multipla" ${q.tipo==='multipla'?'selected':''}>Múltipla escolha</option><option value="aberta" ${q.tipo==='aberta'?'selected':''}>Dissertativa</option></select><button class="btn sm red" onclick="qs.splice(${i},1);rf()">✕</button></div><textarea rows="3" style="margin-top:10px" placeholder="Enunciado" oninput="qs[${i}].enun=this.value">${esc(q.enun)}</textarea>`+(q.tipo==='multipla'?q.ops.map((o,j)=>`<div class="row" style="flex-wrap:nowrap"><input type="radio" name="ok${i}" ${q.ok===j?'checked':''} onchange="qs[${i}].ok=${j}"><input placeholder="Alternativa ${L[j]}" value="${esc(o)}" oninput="qs[${i}].ops[${j}]=this.value"></div>`).join('')+'<div class="m">Marque a alternativa correta. Deixe em branco as que não usar.</div>':'')+'</div>').join('')+
 `<div class="row"><button class="btn ghost" onclick="addQ();rf()">+ Questão</button><span class="sp"></span><button class="btn ghost" onclick="adminView()">Cancelar</button><button class="btn" onclick="saveProva()">Salvar prova</button></div>`}
async function saveProva(){readTop();if(!E.titulo.trim())return alert('Informe o título.');const Q=[],G=[];
 for(const q of qs){if(!q.enun.trim())continue;
  if(q.tipo==='multipla'){const ix=[];q.ops.forEach((o,j)=>{if(o.trim())ix.push(j)});if(ix.length<2||!ix.includes(q.ok))return alert('Questão "'+q.enun.slice(0,30)+'": use 2+ alternativas e marque a correta.');Q.push({tipo:'multipla',enun:q.enun.trim(),ops:ix.map(j=>q.ops[j].trim())});G.push(ix.indexOf(q.ok))}
  else{Q.push({tipo:'aberta',enun:q.enun.trim()});G.push(-1)}}
 if(!Q.length)return alert('Adicione ao menos uma questão.');
 const id=E.id||R('provas/provas').push().key;
 await R('provas/provas/'+id).set({titulo:E.titulo.trim(),categoria:E.categoria,minutos:+E.minutos||60,saidaPermitida:!!E.saidaPermitida,maxSaidas:E.saidaPermitida?(+E.maxSaidas||0):0,ativa:!!E.ativa,questoes:Q,atualizadoEm:Date.now()});
 await R('provas/gabaritos/'+id).set({gab:G});toast('Prova salva');adminView()}
async function tabAlunos(){const [al,ad]=await Promise.all([val('provas/alunos'),val('provas/admins')]);
 const us=[...Object.entries(ad||{}).map(([k,v])=>[k,v,'admins']),...Object.entries(al||{}).map(([k,v])=>[k,v,'alunos'])];
 $('#ad').innerHTML=`<h2>Candidatos e ADMs</h2><div class="card"><label class="f">Login</label><input id="nl" autocapitalize="none" placeholder="letras, números, _ ou -"><label class="f">Nome completo</label><input id="nn"><label class="f">Senha (mín. 4)</label><input id="np"><label class="f">Perfil</label><select id="nf"><option value="alunos">Candidato</option><option value="admins">ADM</option></select><button class="btn" onclick="addAluno()">Criar / atualizar</button><p id="er" class="err"></p></div>`+
 us.map(([k,v,t])=>`<div class="card row"><div class="av">${esc((v.nome||'?')[0]).toUpperCase()}</div><div class="sp"><b>${esc(v.nome)}</b><div class="m">${esc(k)}</div></div><span class="pill ${t==='admins'?'fin':'off'}">${t==='admins'?'ADM':'Candidato'}</span>${k===me.login?'':`<button class="btn sm red" onclick="delAluno('${t}','${k}')">Excluir</button>`}</div>`).join('')}
async function addAluno(){const l=key($('#nl').value.trim()),n=$('#nn').value.trim(),p=$('#np').value;
 if(!l||!n||p.length<4)return err('Preencha tudo (senha com 4+ caracteres).');
 await R('provas/'+$('#nf').value+'/'+l).set({nome:n,hash:await sha(p)});toast('Salvo');tabAlunos()}
async function delAluno(t,k){if(confirm('Excluir '+k+'?')){await R('provas/'+t+'/'+k).remove();tabAlunos()}}
async function tabVivo(){GB=(await val('provas/gabaritos'))||{};const r=R('provas/sessoes'),cb=s=>{SN=vals(s.val());drawVivo()};r.on('value',cb);unsubs.push(()=>r.off('value',cb));
 const t=setInterval(drawVivo,10000);unsubs.push(()=>clearInterval(t))}
function nota(s){const g=(GB[s.provaId]||{}).gab;if(!g)return'-';let t=0,a=0;g.forEach((k,i)=>{if(k>=0){t++;if((s.respostas||{})[i]===k)a++}});return t?a+'/'+t:'-'}
function drawVivo(){if(!$('#ad'))return;const now=Date.now(),sit=s=>s.status==='finalizada'?'fin':now-s.ultimo>30000?'off':s.fora?'bad':'ok',c={ok:0,bad:0,off:0,fin:0};SN.forEach(s=>c[sit(s)]++);
 const lb={ok:'🟢 Na prova',bad:'🔴 FORA da prova',off:'⚪ Desconectado',fin:'✅ Finalizada'};
 $('#ad').innerHTML=`<h2>Ao vivo</h2><div class="m">Atualização em tempo real</div><div class="stats"><div class="stat"><b style="color:var(--ok)">${c.ok}</b><span>Na prova</span></div><div class="stat"><b style="color:var(--bad)">${c.bad}</b><span>Fora da prova</span></div><div class="stat"><b>${c.off}</b><span>Desconectados</span></div><div class="stat"><b style="color:var(--a)">${c.fin}</b><span>Finalizadas</span></div></div><div class="scroll"><table><tr><th>Candidato</th><th>Prova</th><th>Situação</th><th>Saídas</th><th>Nota</th><th></th></tr>`+
 [...SN].sort((a,b)=>b.inicio-a.inicio).map(s=>{const k=sit(s);return `<tr><td><b>${esc(s.nome)}</b></td><td>${esc(s.provaTitulo)}</td><td><span class="pill ${k}">${lb[k].slice(3)}</span>${s.motivo?` <span class="m">${esc(s.motivo)}</span>`:''}</td><td>${s.saidas||0}</td><td>${nota(s)}</td><td><button class="btn sm" onclick="verResp('${s.id}')">Ver</button> <button class="btn sm red" onclick="delSess('${s.id}')">Reabrir</button></td></tr>`}).join('')+'</table></div>'+(SN.length?'':'<p class="m" style="text-align:center;margin-top:30px">Nenhuma prova em andamento.</p>')}
function delSess(id){if(confirm('Apagar esta tentativa para o candidato refazer?'))R('provas/sessoes/'+id).remove()}
async function verResp(id){const s=SN.find(x=>x.id===id),p=await val('provas/provas/'+s.provaId),g=(GB[s.provaId]||{}).gab||[],Rs=s.respostas||{};
 modal(`<h2>${esc(s.nome)}</h2><p class="m">${esc(p.titulo)} · nota ${nota(s)}</p><div style="max-height:58vh;overflow:auto;margin:12px 0">`+(p.questoes||[]).map((q,i)=>{const r=Rs[i];return `<div class="card"><b style="color:var(--a)">${i+1}.</b> ${esc(q.enun)}<div style="margin-top:8px">`+(q.tipo==='multipla'?(r==null?'<span class="m">Sem resposta</span>':`${L[r]}) ${esc(q.ops[r])} ${r===g[i]?'✅':'❌'}`):`<i>${esc(r||'(em branco)')}</i>`)+'</div></div>'}).join('')+'</div><button class="btn full" onclick="closeModal()">Fechar</button>')}
boot().then(ok=>{if(ok){init();loginView()}else view('<div class="login"><div class="emb">⚠️</div><div class="card"><h2>Sem conexão com o Firebase</h2><p class="m" style="margin-top:8px">Abra este arquivo direto no navegador (Chrome) ou hospede-o, com internet liberada. Em visualizadores de prévia ele não funciona.</p></div></div>')});
</script></body></html>
