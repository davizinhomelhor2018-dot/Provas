 const co=c.coment||{},nt=c.notas||{},ks=Object.keys(co).filter(i=>co[i]);
 modal(`<h2>Resultado</h2><div class="row"><b style="font:700 30px Rajdhani;color:var(--a)">${fmt(c.total)} / ${fmt(c.max)}</b><span class="pill ${c.aprovado?'ok':'bad'}">${c.aprovado?'Aprovado':'Reprovado'}</span></div><p class="m">${Math.round(c.pct||0)}% de aproveitamento</p>`+
  (c.parecer?`<h3>Parecer do comando</h3><div class="card" style="white-space:pre-wrap">${esc(c.parecer)}</div>`:'')+
  (ks.length?'<h3>Comentários</h3><div style="max-height:36vh;overflow:auto">'+ks.map(i=>`<div class="card"><b style="color:var(--a)">Questão ${+i+1}</b> <span class="m">${nt[i]!=null?fmt(nt[i])+' ponto(s)':''}</span><div style="white-space:pre-wrap;margin-top:6px">${esc(co[i])}</div></div>`).join('')+'</div>':'')+
  '<button class="btn full" style="margin-top:12px" onclick="closeModal()">Fechar</button>')}
async function finish(m){if(ended)return;ended=true;stopExam();closeModal();outFs();
 try{await SREF.update({status:'finalizada',fim:Date.now(),motivo:m,fora})}catch(e){alert(falha(e))}
 const ok=m.startsWith('Finalizada');
 view(hdr()+`<div class="login"><div class="card" style="text-align:center"><div style="font-size:52px">${ok?'✅':'⛔'}</div><h2 style="margin:6px 0">Prova enviada</h2><p class="m" style="margin-bottom:12px">${esc(m)}</p><div class="note" style="text-align:left">⏳ <b>Aguarde a correção.</b> Suas respostas já estão com o comando. O resultado aparece aqui na tela de provas quando for liberado. Não é possível rever a prova.</div><button class="btn full" onclick="listProvas()">Ir para minhas provas</button></div></div>`)}

/* ---------- ADM: correção ---------- */
const sit2=s=>!s.correcao||s.correcao.status!=='corrigida'?'pend':s.correcao.liberada?'lib':'cor';
const filtrarCorr=()=>SN.filter(s=>s.status==='finalizada'&&(COR.f==='todas'||sit2(s)===COR.f)&&(!COR.pv||s.provaId===COR.pv)).sort((a,b)=>(b.fim||0)-(a.fim||0));
function autoNotas(p,g,s){const n={};(p.questoes||[]).forEach((q,i)=>{if(q.tipo==='multipla')n[i]=(s.respostas||{})[i]===g[i]?ptsQ(p,i):0});return n}
function notaTxt(s){const c=s.correcao;if(c&&c.status==='corrigida')return fmt(c.total)+' / '+fmt(c.max);
 const p=PV[s.provaId],g=(GB[s.provaId]||{}).gab;if(!p||!g)return'-';const a=autoNotas(p,g,s);let t=0;Object.values(a).forEach(v=>t+=v);
 return fmt(t)+' / '+fmt(maxP(p))+(Object.keys(a).length<(p.questoes||[]).length?' <span class="m">(parcial)</span>':'')}
async function tabCorrigir(){CUR=null;
 try{const[pv,gb]=await Promise.all([val('provas/provas'),val('provas/gabaritos')]);PV=pv||{};GB=gb||{}}catch(e){$('#ad').innerHTML='<div class="card"><p class="err">'+esc(falha(e))+'</p></div>';return}
 const r=R('provas/sessoes'),cb=s=>{SN=vals(s.val());if(!CUR)drawCorr()};r.on('value',cb);unsubs.push(()=>r.off('value',cb));
 if(PEDIR){const x=PEDIR;PEDIR=null;abrirCorrecao(x)}}
function irCorrigir(id){PEDIR=id;adminView('corrigir')}
function drawCorr(){if(!$('#ad'))return;
 const fin=SN.filter(s=>s.status==='finalizada'),c={pend:0,cor:0,lib:0};fin.forEach(s=>c[sit2(s)]++);
 const lista=filtrarCorr(),lb={pend:'A corrigir',cor:'Corrigida',lib:'Liberada'},pc={pend:'off',cor:'fin',lib:'ok'};
 $('#ad').innerHTML=`<h2>Correção</h2><div class="stats"><div class="stat"><b style="color:var(--warn)">${c.pend}</b><span>A corrigir</span></div><div class="stat"><b style="color:var(--a)">${c.cor}</b><span>Corrigidas (não liberadas)</span></div><div class="stat"><b style="color:var(--ok)">${c.lib}</b><span>Liberadas</span></div></div>
 <div class="row" style="margin-bottom:10px"><select style="width:auto;margin:0" onchange="COR.f=this.value;drawCorr()">${[['pend','A corrigir'],['cor','Corrigidas'],['lib','Liberadas'],['todas','Todas']].map(([k,n])=>`<option value="${k}" ${COR.f===k?'selected':''}>${n}</option>`).join('')}</select>
 <select style="width:auto;margin:0;max-width:260px" onchange="COR.pv=this.value;drawCorr()"><option value="">Todas as provas</option>${Object.entries(PV).map(([id,p])=>`<option value="${id}" ${COR.pv===id?'selected':''}>${esc(p.titulo)}</option>`).join('')}</select>
 <span class="sp"></span><button class="btn ghost sm" onclick="liberarTodas()">Liberar todas as corrigidas</button><button class="btn ghost sm" onclick="exportCSV()">Exportar CSV</button></div>
 <div class="scroll"><table><tr><th>Candidato</th><th>Prova</th><th>Nota</th><th>Saídas</th><th>Situação</th><th></th></tr>`+
 lista.map(s=>{const k=sit2(s);return `<tr><td><b>${esc(s.nome)}</b><div class="m">${esc(s.motivo||'')}</div></td><td>${esc(s.provaTitulo)}</td><td>${notaTxt(s)}</td><td>${s.saidas||0}</td><td><span class="pill ${pc[k]}">${lb[k]}</span></td><td><button class="btn sm" onclick="abrirCorrecao('${s.id}')">${k==='pend'?'Corrigir':'Revisar'}</button></td></tr>`}).join('')+'</table></div>'+
 (lista.length?'':'<p class="m" style="text-align:center;margin-top:30px">Nada nesta lista.</p>')}
async function abrirCorrecao(id){CUR=id;
 try{const s0=await val('provas/sessoes/'+id);if(!s0){CUR=null;return drawCorr()}
  const s={id,...s0},p=PV[s.provaId]||await val('provas/provas/'+s.provaId);
  if(!p){alert('A prova desta tentativa foi excluída.');CUR=null;return drawCorr()}
  PV[s.provaId]=p;if(!GB[s.provaId])GB[s.provaId]=(await val('provas/gabaritos/'+s.provaId))||{};
  const g=GB[s.provaId].gab||[],c=s.correcao||{},notas=autoNotas(p,g,s),coment={};
  Object.entries(c.notas||{}).forEach(([k,v])=>{if(v!=null)notas[k]=v});Object.entries(c.coment||{}).forEach(([k,v])=>{if(v)coment[k]=v});
  K={id,s,p,g,notas,coment,parecer:c.parecer||''};telaCorr()}
 catch(e){CUR=null;alert(falha(e))}}
function calcK(){const p=K.p,mx=maxP(p);let t=0,pend=0;
 (p.questoes||[]).forEach((q,i)=>{const v=K.notas[i];if(v==null||v===''||isNaN(+v)){pend++;return}t+=Math.min(Math.max(+v,0),ptsQ(p,i))});
 const pct=mx?t/mx*100:0,min=p.minimo==null?60:+p.minimo;return{t,mx,pend,pct,ap:pct>=min,min}}
function updTot(){const c=calcK(),e=$('#tot');if(e)e.innerHTML=`<b style="font-size:24px;color:var(--a)">${fmt(c.t)} / ${fmt(c.mx)}</b> <span class="m">(${Math.round(c.pct)}%)</span> <span class="pill ${c.ap?'ok':'bad'}">${c.ap?'Aprovado':'Reprovado'}</span>${c.pend?` <span class="m">· ${c.pend} questão(ões) sem nota</span>`:''}<div class="m">Mínimo para aprovar: ${c.min}%</div>`}
function telaCorr(){const{s,p,g}=K,Rs=s.respostas||{},dur=s.fim&&s.inicio?Math.round((s.fim-s.inicio)/60000)+' min':'-',ja=s.correcao||{};
 $('#ad').innerHTML=`<div class="row"><button class="btn ghost sm" onclick="sairCorr()">← Voltar à lista</button><span class="sp"></span><button class="btn ghost sm" onclick="vizinho(-1)">‹ Anterior</button><button class="btn ghost sm" onclick="vizinho(1)">Próximo ›</button></div>
 <h2 style="margin-top:12px">${esc(s.nome)}</h2><div>${cat(p.categoria)} <span class="chip">${esc(p.titulo)}</span><span class="chip">⏱ ${dur}</span><span class="chip">🚪 ${s.saidas||0} saída(s)</span><span class="chip">${esc(s.motivo||'')}</span>${ja.liberada?'<span class="pill ok">Resultado liberado</span>':''}</div>`+
 (p.questoes||[]).map((q,i)=>{const r=Rs[i],pt=ptsQ(p,i);let resp;
  if(q.tipo==='multipla'){const ok=r===g[i];resp=r==null?'<span class="m">Sem resposta</span>':`<b>${L[r]})</b> ${esc((q.ops||[])[r]||'')} ${ok?'✅':'❌'}`;
   if(!ok)resp+=`<div class="m" style="margin-top:4px">Correta: <b>${L[g[i]]})</b> ${esc((q.ops||[])[g[i]]||'')}</div>`}
  else resp=`<div style="white-space:pre-wrap;background:#0b0b0f;border:1px solid #2a2a33;border-radius:10px;padding:10px">${r?esc(r):'<span class="m">(em branco)</span>'}</div>`;
  return `<div class="card"><div class="row"><b style="color:var(--a)">${i+1}.</b><span class="chip" style="margin:0">${q.tipo==='multipla'?'Múltipla escolha':'Dissertativa'}</span><span class="sp"></span><span class="m">vale ${fmt(pt)}</span></div><p style="margin:8px 0">${esc(q.enun)}</p>${resp}
  <div class="row" style="margin-top:10px"><label class="m" style="margin:0">Nota</label><input type="number" min="0" max="${pt}" step="0.25" style="width:96px;margin:0" id="nt${i}" value="${K.notas[i]??''}" oninput="setNota(${i},this.value)">${q.tipo==='aberta'?`<button class="btn ghost sm" onclick="rapido(${i},0)">0</button><button class="btn ghost sm" onclick="rapido(${i},${pt/2})">½</button><button class="btn ghost sm" onclick="rapido(${i},${pt})">Total</button>`:''}</div>
  <textarea rows="2" placeholder="Comentário para o candidato (opcional)" style="margin-top:8px" oninput="K.coment[${i}]=this.value">${esc(K.coment[i]||'')}</textarea></div>`}).join('')+
 `<div class="card"><div id="tot"></div><label class="f" style="margin-top:12px">Parecer geral (o candidato vê depois de liberado)</label><textarea rows="3" oninput="K.parecer=this.value">${esc(K.parecer)}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="salvarCorr('rascunho')">Salvar rascunho</button><span class="sp"></span>${ja.liberada?'<button class="btn ghost" onclick="salvarCorr(\'ocultar\')">Ocultar resultado</button>':''}<button class="btn ghost" onclick="salvarCorr('proximo')">Salvar e próximo</button><button class="btn" onclick="salvarCorr('liberar')">Salvar e liberar</button></div></div>`;
 updTot()}
function setNota(i,v){K.notas[i]=v===''?null:+v;updTot()}
function rapido(i,v){K.notas[i]=v;const e=$('#nt'+i);if(e)e.value=v;updTot()}
async function salvarCorr(modo){const c=calcK();
 if((modo==='liberar'||modo==='proximo')&&c.pend)return alert('Falta dar nota em '+c.pend+' questão(ões).');
 const notas={},coment={},old=K.s.correcao||{};
 (K.p.questoes||[]).forEach((q,i)=>{const v=K.notas[i];if(v!=null&&v!==''&&!isNaN(+v))notas[i]=Math.min(Math.max(+v,0),ptsQ(K.p,i));if((K.coment[i]||'').trim())coment[i]=K.coment[i].trim()});
 const feita=!c.pend,lib=feita&&(modo==='liberar'||(modo!=='ocultar'&&!!old.liberada));
 const dados={notas,coment,parecer:(K.parecer||'').trim(),total:c.t,max:c.mx,pct:Math.round(c.pct*10)/10,aprovado:c.ap,status:feita?'corrigida':'rascunho',liberada:lib,por:me.login,em:Date.now()};
 try{await R('provas/sessoes/'+K.id+'/correcao').set(dados);K.s.correcao=dados;
  toast(modo==='liberar'?'Resultado liberado':modo==='ocultar'?'Resultado ocultado':'Correção salva');
  if(modo==='liberar'||modo==='proximo')proximoDaFila(K.id);else telaCorr()}
 catch(e){alert(falha(e))}}
function proximoDaFila(atual){const x=SN.filter(s=>s.status==='finalizada'&&s.id!==atual&&sit2(s)==='pend').sort((a,b)=>(a.fim||0)-(b.fim||0))[0];x?abrirCorrecao(x.id):sairCorr()}
function vizinho(d){const f=filtrarCorr(),i=f.findIndex(x=>x.id===K.id),j=i+d;if(j>=0&&j<f.length)abrirCorrecao(f[j].id);else toast('Não há mais candidatos nesta lista')}
function sairCorr(){CUR=null;K=null;drawCorr()}
async function liberarTodas(){const l=SN.filter(s=>s.status==='finalizada'&&sit2(s)==='cor');
 if(!l.length)return alert('Não há provas corrigidas aguardando liberação.');
 if(!confirm('Liberar o resultado de '+l.length+' candidato(s)?'))return;
 try{const u={};l.forEach(s=>u[s.id+'/correcao/liberada']=true);await R('provas/sessoes').update(u);toast('Resultados liberados')}catch(e){alert(falha(e))}}
function exportCSV(){const rows=[['Candidato','Login','Prova','Categoria','Nota','Máximo','%','Resultado','Situação','Saídas','Motivo']];
 SN.filter(s=>s.status==='finalizada').forEach(s=>{const c=s.correcao||{},p=PV[s.provaId]||{},ok=c.status==='corrigida';
  rows.push([s.nome,s.login,s.provaTitulo,p.categoria||'',ok?c.total:'',ok?c.max:'',ok?c.pct:'',ok?(c.aprovado?'Aprovado':'Reprovado'):'',ok?(c.liberada?'Liberada':'Corrigida'):'A corrigir',s.saidas||0,s.motivo||''])});
 const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='resultados-provas.csv';a.click()}
function nota(s){const c=s.correcao;if(c&&c.status==='corrigida')return fmt(c.total)+'/'+fmt(c.max);
 const g=(GB[s.provaId]||{}).gab;if(!g)return'-';let t=0,a=0;g.forEach((k,i)=>{if(k>=0){t++;if((s.respostas||{})[i]===k)a++}});return t?a+'/'+t+' (auto)':'-'}

boot().then(ok=>{if(ok){init();loginView()}else view('<div class="login"><div class="emb">⚠️</div><div class="card"><h2>Sem conexão com o Firebase</h2><p class="m" style="margin-top:8px">Abra este arquivo direto no navegador (Chrome) ou hospede-o, com internet liberada. Em visualizadores de prévia ele não funciona.</p></div></div>')});
</script></body></html>
